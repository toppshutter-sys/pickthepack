# Starter config for deploying with Fly.io (`fly launch` / `fly deploy`).
# `app` must be globally unique on Fly — change it before deploying, or let
# `fly launch` rename it interactively. `mia` (Miami) is Fly's lowest-latency
# region for Caribbean players — worth keeping even if `fly launch` suggests
# a different default.
app = "pick-the-pack-server"
primary_region = "mia"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
